server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location = / { return 308 /simulou-passou/; }
  location = /simulou-passou { return 308 /simulou-passou/; }
  location ^~ /simulou-passou/api/ {
    proxy_ssl_server_name on;
    proxy_set_header Host seyljsqmhlopkcauhlor.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 45s;
    proxy_pass https://seyljsqmhlopkcauhlor.supabase.co/functions/v1/simulou-passou-api/api/;
  }
  location /simulou-passou/ {
    expires -1;
    try_files $uri $uri/ /simulou-passou/index.html;
  }
}
